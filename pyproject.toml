[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-image-sorter"
version = "0.1.0"
description = "Local, reviewable sports image sorting with protected originals"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13"]
license = "MIT"

[project.scripts]
sports-sorter = "sports_sorter.cli:main"

[tool.setuptools.package-data]
sports_sorter = ["native/*.swift", "web/*"]
